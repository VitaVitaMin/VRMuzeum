<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Виртуальный Музей</title>
  
  <!-- A-Frame и Look-At компонент -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
  
  <!-- Стили -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- UI Поверх 3D (Название комнаты) -->
  <div id="ui-header">
    <h1 id="room-title">Загрузка...</h1>
    <p>Виртуальный Музей</p>
  </div>

  <!-- Отдельная кнопка для VR (Cardboard) -->
  <button id="custom-vr-btn">👓 РЕЖИМ VR (Cardboard)</button>

  <!-- 3D Сцена -->
  <a-scene 
    embedded 
    loading-screen="enabled: false"
    vr-mode-ui="enabled: false"
    renderer="colorManagement: true; antialias: true; physicallyCorrectLights: true; highRefreshRate: true;"
  >
    <!-- Освещение -->
    <a-light type="ambient" color="#FFFFFF" intensity="1.5"></a-light>
    
    <!-- Панорама -->
    <a-sky id="sky-pano" src="" rotation="0 -90 0" material="shader: flat; color: #FFF;"></a-sky>

    <!-- Контейнеры для точек и 3D панелей -->
    <a-entity id="links-container"></a-entity>
    <a-entity id="exhibits-container"></a-entity>
    <a-entity id="modal-container"></a-entity>

    <!-- Мышиный курсор для 2D режима (ПК / Мобильный без VR) -->
    <a-entity id="mouse-cursor" cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>

    <!-- Камера (Сенсорное вращение включено, гироскоп отключен для стандартного управления) -->
    <a-camera id="main-camera" look-controls="magicWindowTrackingEnabled: false; touchEnabled: true; reverseMouseDrag: true; reverseTouchDrag: true" wasd-controls="enabled: false">
      <!-- VR прицел (изначально выключен, включается только в VR) -->
      <a-entity id="vr-cursor" visible="false" cursor="fuse: false" raycaster="objects: .clickable; enabled: false" position="0 0 -1"
                geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
                material="color: #FFF; shader: flat; transparent: true; opacity: 0.7"></a-entity>
      
      <!-- VR Инструкция (изначально скрыта) -->
      <a-entity id="vr-instructions" position="0 0 -1.5" visible="false">
      </a-entity>

      <!-- VR Fade для плавных переходов (белый свет/blur) -->
      <a-sphere id="vr-fade" radius="0.1" position="0 0 -0.05" material="color: #FFF; shader: flat; transparent: true; opacity: 1; side: back"></a-sphere>
    </a-camera>
  </a-scene>

  <!-- Кнопка и панель для показа координат -->
  <button id="coord-toggle-btn">📍</button>
  <div id="coord-panel" style="display: none;">
    <p>Наведите центр экрана на нужное место. Вот координаты (x y z):</p>
    <div id="coord-value">0.00 0.00 -3.00</div>
    <p class="coord-hint">Скопируйте их и вставьте в config.js</p>
  </div>

  <!-- Настройки и Скрипты -->
  <script src="config.js"></script>
  <script src="main.js"></script>
</body>
</html>
